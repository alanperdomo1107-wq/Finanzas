<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas · Agregar movimiento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid px-0">
                <a class="navbar-brand m-0 brand-mark" href="index.html">
                    Finanzas
                    <span class="brand-tagline">Registro de ingresos y egresos</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"></li>
                </ul>

                <form class="d-flex" role="search">
                    <a class="nav-link nav-item" href="index.html">Inicio</a>
                    <a class="nav-link nav-item is-current" href="agregarMovimiento.html">Movimientos</a>
                    <a class="nav-link nav-item" href="estadisticas.html">Estadisticas</a>
                    <input class="form-control me-2" type="search" placeholder="Buscar" aria-label="Search"/>
                    <button class="btn btn-outline-success" type="submit">Buscar</button>
                </form>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="page-heading">
            <h1>Agregar movimiento</h1>
            <p>Registre un nuevo ingreso o egreso en el libro de finanzas.</p>
        </div>

        <section class="ledger-card cardAgregarMovimiento">
            <div class="form-grid">
                <div class="form-field">
                    <label for="tipoMovimiento">Tipo de movimiento</label>
                    <select id="tipoMovimiento">
                        <option value="">Seleccione el tipo</option>
                        <option value="Ingreso">Ingreso</option>
                        <option value="Egreso">Egreso</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="inputfecha">Fecha</label>
                    <input type="date" id="inputfecha">
                </div>

                <div class="form-field">
                    <label for="inputmonto">Monto</label>
                    <input type="number" id="inputmonto" placeholder="0.00">
                </div>

                <div class="form-field">
                    <label for="categoriaMovimiento">Categoria</label>
                    <select id="categoriaMovimiento">
                        <option value="">Seleccione</option>
                        <option value="Corte">Corte de pasto</option>
                        <option value="Venta">Venta</option>
                        <option value="Impuestos">Impuestos</option>
                        <option value="Ahorro">Ahorro</option>
                    </select>
                </div>

                <div class="form-field span-2">
                    <label for="inputdescripcion">Descripcion</label>
                    <textarea id="inputdescripcion" placeholder="Ingrese una breve descripcion" maxlength="100"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" id="crearMovimiento" class="btn-ledger is-accent">Crear movimiento</button>
            </div>

            <div class="subsection agregarCat">
                <h3>Agregar una categoria</h3>
                <div class="inline-form">
                    <input type="text" id="categoriaAgregada" placeholder="Nombre de la categoria">
                    <button type="button" id="crearCategoria" class="btn-ledger">Crear</button>
                </div>
            </div>
        </section>

        <div id="contenedorTablas"></div>
    </main>
    <footer></footer>

</body>
<script type="module" src="clases/movimientos.js"></script>
<script type="module" src="gestores/gestorMovimientos.js"></script>
<script type="module" src="scripts/agregarMovimiento.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
